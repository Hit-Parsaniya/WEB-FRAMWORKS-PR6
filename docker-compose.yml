# ==============================================================================
# Docker Compose Orchestration (Practical 11)
# Services: frontend (React:5173), backend (Node/Express:5000), mongodb (Mongo:27017)
# Network: app-network (custom bridge)
# Volume: mongo-data (named volume for database persistence across restarts)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: pr11-mongodb
    restart: unless-stopped
    ports:
      # Host port : Container port
      - "27017:27017"
    volumes:
      # Named volume for data persistence (Supplementary Problem 3)
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Node.js / Express Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pr11-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Referencing the MongoDB service by its Docker service name 'mongodb'
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=pr11_super_secret_jwt_key_2026_antigravity
      - JWT_EXPIRES_IN=1h
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Vite Single Page Application)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr11-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Host browser connects to backend mapped on host localhost:5000
      - VITE_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

# ------------------------------------------------------------------------------
# Named Volumes (Data Persistence)
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    name: pr11_mongo_data
    driver: local

# ------------------------------------------------------------------------------
# User-Defined Bridge Network (Inter-Container DNS & Isolation)
# ------------------------------------------------------------------------------
networks:
  app-network:
    name: pr11_app_network
    driver: bridge
